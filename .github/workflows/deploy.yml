# verify → deploy → healthcheck. Первый упавший шаг останавливает workflow.
# pull_request гоняет только verify. Секреты приложения остаются в /opt/invoice-keeper/.env.
# Упало — в Summary запуска блок «упал шаг …»: хвост лога шага, для smoke и deploy ещё
# docker compose ps и логи сервисов. Полные логи — артефакт <job>-logs.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: invoice_keeper
        # 5432 на хосте занимает compose в smoke
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U invoice -d invoice_keeper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - id: backup-selftest
        name: Backup selftest
        run: |
          mkdir -p ci-logs
          sh infra/ops/backup/selftest.sh 2>&1 | tee ci-logs/backup-selftest.log
      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - id: pip-install
        name: Backend install
        run: python -m pip install -q -r backend/requirements.txt 2>&1 | tee ci-logs/pip-install.log
      - id: pytest
        name: Backend pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://invoice:change-me@127.0.0.1:5433/invoice_keeper
        run: python -m pytest -x -ra --tb=short -q -p no:cacheprovider 2>&1 | tee ../ci-logs/pytest.log
      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: npm-ci
        name: Web install
        working-directory: frontend
        run: npm ci --no-audit --no-fund 2>&1 | tee ../ci-logs/npm-ci.log
      - id: typecheck
        name: Web typecheck
        working-directory: frontend
        run: npx tsc --noEmit --pretty false 2>&1 | tee ../ci-logs/typecheck.log
      - id: web-build
        name: Web build
        working-directory: frontend
        run: npx vite build 2>&1 | tee ../ci-logs/web-build.log
      - id: smoke
        name: Jury smoke
        run: bash infra/ops/smoke.sh 2>&1 | tee ci-logs/smoke.log
      - name: Failure report
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: bash infra/ops/ci/report.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: ci-logs
          if-no-files-found: ignore

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      # ECDSA nistp256 217.144.184.232. Публичный отпечаток. Переустановка VPS — поменять, см. docs/infra.md.
      DEPLOY_FINGERPRINT: SHA256:E+eFNJNFwH/+68XXrzlY+Gtpfs/5eRKrwHFmTWL+s3c
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - id: ssh-setup
        name: SSH key and host fingerprint
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ci-logs ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -t ecdsa "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keygen -lf ~/.ssh/known_hosts 2>&1 | tee ci-logs/ssh-setup.log
          grep -qF "$DEPLOY_FINGERPRINT" ci-logs/ssh-setup.log || {
            echo "Отпечаток сервера не совпал с $DEPLOY_FINGERPRINT" | tee -a ci-logs/ssh-setup.log
            exit 1
          }
      - id: deploy
        name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < infra/ops/deploy-remote.sh 2>&1 | tee ci-logs/deploy.log
      - name: Failure report
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: bash infra/ops/ci/report.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs
          path: ci-logs
          if-no-files-found: ignore

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - id: prod-health
        name: Prod health
        run: |
          mkdir -p ci-logs
          url=https://rekeeper.ru/api/v1/health
          code=000
          for i in $(seq 1 24); do
            code=$(curl -sS --max-time 10 -o ci-logs/body.txt -w '%{http_code}' "$url" 2>ci-logs/curl.err || true)
            echo "попытка $i: HTTP $code" | tee -a ci-logs/prod-health.log
            [ "$code" = 200 ] && exit 0
            sleep 5
          done
          {
            echo "--- отчёт об ошибке ---"
            echo "$url не ответил 200 за 2 минуты, последний HTTP $code"
            cat ci-logs/curl.err
            head -c 2000 ci-logs/body.txt || true
            echo
          } | tee -a ci-logs/prod-health.log
          exit 1
      - name: Failure report
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: bash infra/ops/ci/report.sh
