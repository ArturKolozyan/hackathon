# Push в main обновляет VPS. .env на сервере не трогаем и в git не кладём.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: invoice-keeper-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          protocol: tcp4
          # ed25519 217.144.184.232, ssh-keyscan 2026-10-23. После переустановки VPS обновить, см. docs/infra.md.
          fingerprint: SHA256:LpmjSctDQ1eIK1qjX8VOZKRIpLpVs6k1bh6BXzPBAfg
          command_timeout: 30m
          script: |
            set -eu
            cd /opt/invoice-keeper
            test -f .env
            export GIT_TERMINAL_PROMPT=0
            git fetch origin main
            if git cat-file -e "origin/main:.env" >/dev/null 2>&1; then
              echo ".env отслеживается в git — деплой остановлен" >&2
              exit 1
            fi
            git reset --hard origin/main
            test -f .env
            echo "HEAD $(git rev-parse --short HEAD)"
            docker compose up --build -d
            docker image prune -f
            command -v curl >/dev/null
            ok=0
            i=0
            while [ "$i" -lt 12 ]; do
              if curl -fsS "http://127.0.0.1:8080/api/v1/health"; then
                echo
                ok=1
                break
              fi
              i=$((i + 1))
              sleep 5
            done
            test "$ok" = 1
