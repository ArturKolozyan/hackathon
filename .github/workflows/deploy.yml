# verify → deploy → healthcheck. Любое падение останавливает workflow.
# pull_request гоняет только verify. Секреты приложения остаются в /opt/invoice-keeper/.env.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: invoice_keeper
        # 5432 на хосте занимает compose в smoke
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U invoice -d invoice_keeper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Backup schedule selftest
        run: sh ops/backup/selftest.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://invoice:change-me@127.0.0.1:5433/invoice_keeper
        run: python -m pytest -q -x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Web build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Jury smoke
        run: sh ops/smoke.sh

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          # ECDSA nistp256 217.144.184.232. drone-ssh берёт его раньше ED25519. Публичный отпечаток. Переустановка VPS — поменять, см. docs/infra.md.
          fingerprint: SHA256:E+eFNJNFwH/+68XXrzlY+Gtpfs/5eRKrwHFmTWL+s3c
          command_timeout: 25m
          script: |
            set -eu
            cd /opt/invoice-keeper
            git config --global --get-all safe.directory 2>/dev/null | grep -qx /opt/invoice-keeper || git config --global --add safe.directory /opt/invoice-keeper
            export GIT_TERMINAL_PROMPT=0
            git pull --ff-only origin main
            docker compose up --build -d
            port=$(grep -E '^HTTP_PORT=' .env | tail -n 1 | cut -d= -f2- || true)
            port=${port:-8080}
            for _ in $(seq 1 36); do
              curl -fsS --max-time 5 "http://127.0.0.1:${port}/healthz" >/dev/null && exit 0
              sleep 5
            done
            echo "healthcheck failed: http://127.0.0.1:${port}/healthz" >&2
            docker compose ps >&2 || true
            docker compose logs --tail=80 api web caddy worker bot >&2 || true
            exit 1

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prod health
        run: |
          for _ in $(seq 1 24); do
            curl -fsS --max-time 10 https://rekeeper.ru/api/v1/health && exit 0
            sleep 5
          done
          echo "https://rekeeper.ru/api/v1/health не отвечает" >&2
          exit 1
