# Caddy терминирует TLS и присылает X-Forwarded-Proto. Иначе API видит http.
# Сжатие — на Caddy (gzip и zstd). Здесь gzip выключен: иначе nginx сожмёт
# в gzip раньше и клиент с zstd его не получит.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip off;

    location = /api/v1/assistant/messages {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        # Имя api резолвится на каждый запрос. Литерал в proxy_pass
        # запоминает IP при старте nginx: после force-recreate api
        # web держит старый адрес и /api/* отвечает 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
