# Caddy терминирует TLS и присылает X-Forwarded-Proto. Иначе API видит http.
# Сжатие — на Caddy (gzip и zstd). Здесь gzip выключен: иначе nginx сожмёт
# в gzip раньше и клиент с zstd его не получит.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip off;

    # Ассистент — отдельный контейнер. Короткий таймаут: упавший сервис не держит панель.
    # Имени может не быть, пока профиль выключен: резолвер не роняет nginx на старте.
    location /api/v1/assistant/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $assistant http://assistant:8002;
        proxy_pass $assistant;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        # Чек до 10 МБ плюс заголовки multipart. Больше отсекает сам api с понятной ошибкой.
        client_max_body_size 12m;
        # Имя api резолвится на каждый запрос. Литерал в proxy_pass
        # запоминает IP при старте nginx: после force-recreate api
        # web держит старый адрес и /api/* отвечает 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Сборка с хешем в имени: файл не меняется никогда.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html и файлы без хеша каждый раз сверяются с сервером: после деплоя старый интерфейс не залипает.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
