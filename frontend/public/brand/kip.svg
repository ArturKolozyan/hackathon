<svg xmlns="http://www.w3.org/2000/svg" viewBox="225 250 610 610" width="610" height="610" role="img" aria-label="Кип">
  <title>Кип — маскот ассистента rekeeper</title>
  <!-- Flat 2D, no outline, no shadow. Body #E97C35 (PANTONE 7579 C), tail #C66A2D (85% body + 15% black), details #FFFFFF.
       Paint order: tail (behind) -> body -> ears -> eyes -> mouth.
       Pivots for CSS (transform-box: view-box):
         #kip-tail      712px 660px  wag rotate(-8deg..8deg)
         #kip-body      495px 772px  breathe scaleY(.98) from the bottom
         #kip-ear-left  340px 450px  twitch rotate(-6deg)
         #kip-ear-right 650px 450px  twitch rotate(6deg)
         #kip-eye-left  358px 582px, #kip-eye-right 441px 586px  blink scaleY(.1)
         #kip-mouth     402px 650px  hidden until talking -->
  <g id="kip-tail" fill="#C66A2D">
    <path d="M698 726C770 742 830 704 828 640C826 588 790 564 754 574C722 584 708 622 704 660Z"/>
  </g>
  <g id="kip-body" fill="#E97C35">
    <path d="M495 410C596 408 656 426 696 482C740 542 756 624 746 686C736 750 656 776 495 776C334 776 254 750 244 686C234 624 250 542 294 482C334 426 394 412 495 410Z"/>
  </g>
  <g id="kip-ear-left">
    <path fill="#E97C35" d="M282 512C276 452 282 392 296 360C305 340 326 335 345 348C382 373 420 400 452 434Z"/>
    <path d="M316 436C312 410 314 388 322 374C344 386 362 398 378 412" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="kip-ear-right">
    <path fill="#E97C35" d="M708 512C714 452 708 392 694 360C685 340 664 335 645 348C608 373 570 400 538 434Z"/>
    <path d="M674 436C678 410 676 388 668 374C646 386 628 398 612 412" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect id="kip-eye-left" x="341" y="550" width="34" height="64" rx="17" fill="#FFFFFF" transform="rotate(10 358 582)"/>
  <rect id="kip-eye-right" x="424" y="554" width="34" height="64" rx="17" fill="#FFFFFF" transform="rotate(10 441 586)"/>
  <ellipse id="kip-mouth" cx="402" cy="650" rx="16" ry="10" fill="#FFFFFF" style="display:none"/>
</svg>
