# Invoice Keeper. Данные Postgres лежат в томе pgdata и переживают рестарт.
# worker — отдельный процесс: сейчас только горизонт периодов.
# Telegram позже живёт в worker и с московского VPS ходит на api.telegram.org по IPv6.

name: invoice-keeper

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TIMEZONE:-Europe/Moscow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только loopback хоста. Healthcheck ниже ходит в pg_isready внутри контейнера.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: ${TIMEZONE:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    # Только loopback хоста. Healthcheck ходит на 127.0.0.1:8000 внутри контейнера.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: ${TIMEZONE:-Europe/Moscow}
    command: ["worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_DEMO_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@invoice.local}
        VITE_DEMO_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
        VITE_DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-ivan@invoice.local}
        VITE_DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-change-me-user}
        VITE_DEMO_USER_TWO_EMAIL: ${DEMO_USER_TWO_EMAIL:-maria@invoice.local}
    # Не в интернет. Аварийный вход с самого VPS и health деплоя. Снаружи сайт отдаёт Caddy.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Официальный образ, тег зафиксирован. Сертификаты только в caddy_data — не удалять том.
  caddy:
    image: caddy:2.11.7-alpine
    environment:
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      # HTTP/3. Предупреждение quic про размер UDP-буфера не ломает HTTPS по TCP.
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    # curl -f считает 308 успехом и не идёт по редиректу. Так и надо: до сертификата Caddy отвечает 308.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "4", "-H", "Host: rekeeper.ru", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
