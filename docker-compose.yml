# Invoice Keeper. Данные Postgres лежат в томе pgdata и переживают рестарт.
# worker — горизонт, dispatch_due_reminders (почта, webhook, Telegram deliver) и long polling.
# На VPS Aeza bridge часто без IPv6: деплой добавляет compose.telegram-host.yml.
# Снаружи сайт отдаёт caddy (80/443). 5432, 8000 и 8080 опубликованы только на 127.0.0.1.
# backup — pg_dump той же 16-й версии в ./backups (на VPS это /opt/invoice-keeper/backups).

name: invoice-keeper

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TIMEZONE:-Europe/Moscow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только loopback хоста. Worker в network_mode: host (compose.telegram-host.yml)
    # ходит сюда же: 127.0.0.1 — это loopback VPS, не loopback контейнера db.
    # pg_isready ниже выполняется внутри контейнера и порт хоста не использует.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Тот же мажор, что у db: pg_dump 16 и сервер 16. Отдельный образ не собираем.
  # entrypoint образа — инициализация Postgres; его заменяем, иначе поднимется второй сервер.
  # command затирает CMD ["postgres"], чтобы он не приехал аргументом в loop.sh.
  # Сеть bridge: имя db резолвится. В host (compose.telegram-host.yml) backup не переводим.
  # .env целиком не подключаем: туда попал бы токен бота. Пароль только для pg_dump.
  backup:
    image: postgres:16-alpine
    # Образ сам переключает USER на postgres. Дамп пишем на хост в ./backups
    # и ставим каталогу 700, поэтому здесь root. Сервер БД этот контейнер не запускает.
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/backup/loop.sh"]
    command: ["run"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${TIMEZONE:-Europe/Moscow}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_DIR: /backups
    volumes:
      - ./ops/backup:/opt/backup:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: ${TIMEZONE:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    # Только loopback хоста. Healthcheck ходит на 127.0.0.1:8000 внутри контейнера.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: ${TIMEZONE:-Europe/Moscow}
    command: ["worker"]
    # Сеть compose, чтобы имя db резолвилось и на Docker Desktop.
    # IPv6 до Telegram с хоста Linux — compose.telegram-host.yml.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_DEMO_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@invoice.local}
        VITE_DEMO_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
        VITE_DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-ivan@invoice.local}
        VITE_DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-change-me-user}
        VITE_DEMO_USER_TWO_EMAIL: ${DEMO_USER_TWO_EMAIL:-maria@invoice.local}
    # Не в интернет. Аварийный вход — SSH-туннель на этот порт, health деплоя тоже.
    # Снаружи сайт отдаёт Caddy. На VPS оставить WEB_PORT=8080.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Образ зафиксирован. Сертификаты только в caddy_data — не удалять том.
  caddy:
    image: caddy:2.11.7-alpine
    environment:
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    # В caddy:2.11.7-alpine curl есть. -f не считает 308 ошибкой и без -L
    # редирект не открывает: до сертификата «Caddy слушает» — уже успех.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "4", "-H", "Host: rekeeper.ru", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
