# Invoice Keeper. Одна установка — одна организация.
# Контейнеры: web, api, worker, bot, assistant (профиль), db, caddy.
# backup — служебный pg_dump и архив чеков, в список продукта не входит, но на сервере остаётся.
# Файлы чеков живут в томе receipts: api пишет, backup читает.
# Отличия жюри и rekeeper.ru — только .env в корне репозитория. Отдельных override-файлов нет.
# Запуск из корня: docker compose --env-file .env -f infra/docker-compose.yml up --build -d
# Сборка из ../backend и ../frontend, имя проекта задано ниже: тома и сеть invoice-keeper_*.
# Ассистент стартует, только если в .env задан COMPOSE_PROFILES=assistant.

name: invoice-keeper

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TIMEZONE:-Europe/Moscow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/backup/loop.sh"]
    command: ["run"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${TIMEZONE:-Europe/Moscow}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_DIR: /backups
    volumes:
      - ./ops/backup:/opt/backup:ro
      - ../backups:/backups
      - receipts:/receipts:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ASSISTANT_URL: http://assistant:8002
      RECEIPTS_DIR: /data/receipts
      TZ: ${TIMEZONE:-Europe/Moscow}
    volumes:
      - receipts:/data/receipts
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  worker:
    build: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: ${TIMEZONE:-Europe/Moscow}
    command: ["worker"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  bot:
    build: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ASSISTANT_URL: http://assistant:8002
      TZ: ${TIMEZONE:-Europe/Moscow}
    command: ["bot"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  assistant:
    profiles: ["assistant"]
    build:
      context: ../backend
      dockerfile: Dockerfile.assistant
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: ${TIMEZONE:-Europe/Moscow}
    command: ["assistant"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build: ../frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7-alpine
    environment:
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./caddy/entrypoint.sh:/entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "4", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

networks:
  default:
    enable_ipv6: ${ENABLE_IPV6:-false}

volumes:
  pgdata:
  receipts:
  caddy_data:
  caddy_config:
